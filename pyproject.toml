[project]
name = "studentwallet"
version = "0.1.0"
description = "Student personal finance application with Google Gemini AI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.8,<3.0",
    "google-genai>=1.0,<2.0",
]

[tool.vercel]
entrypoint = "backend.main:app"